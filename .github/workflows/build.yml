name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Apex.slnx -c Release

      # Drives the app headlessly over sample data with real keyboard and mouse input and checks what it does.
      # A runner has no game install, so the groups that copy the game's deffiles into a scratch folder are left out
      # (run them on a machine that has Black Ops III). Exits non-zero when any check fails.
      - name: Shots
        run: dotnet run -c Release --no-build --project Apex.Shots -- --fast --skip save-ui,placement,extensions,records,hardening,editor-pass
        env:
          APEX_FORCE_MOCK: '1'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: Apex.Shots/shots/
          if-no-files-found: ignore
